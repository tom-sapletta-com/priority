name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 adapters/standardctl.py validate --policy priority-evolution.dsl.yaml --schema schemas/priority-evolution.schema.json
      - name: dirty example must BLOCK
        run: |
          set +e
          python3 adapters/standardctl.py evaluate --policy priority-evolution.dsl.yaml --state examples/state.json --now 2026-08-19T10:00:00Z --out receipts/ci-decision.json
          status=$?
          test "$status" -eq 3
          python3 -c "import json,sys; r=json.load(open('receipts/ci-decision.json')); sys.exit(0 if r['finalOutcome']=='BLOCK' else 1)"
      - run: python3 adapters/standardctl.py evaluate --policy priority-evolution.dsl.yaml --state examples/state-healthy.json --now 2026-08-19T10:00:00Z --out receipts/ci-healthy.json
      - name: healthy example must PASS
        run: python3 -c "import json,sys; r=json.load(open('receipts/ci-healthy.json')); sys.exit(0 if r['finalOutcome']=='PASS' else 1)"
