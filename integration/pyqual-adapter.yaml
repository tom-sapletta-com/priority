apiVersion: semcod.io/v1alpha1
kind: QualityGateAdapterContract
metadata:
  id: evolutionary-priority-dsl
  version: 0.3.0
  lifecycle: candidate
spec:
  nativePyqualSchemaPinned: true
  enforcementEnabled: false
  pinnedRevision: git:2fe7e4730a6c1d5b3326faaec4e41d455891e0ef
  pinnedDefaultYaml: sources/contracts/pyqual/default.yaml
  reason: >-
    Mapa TOON i `PyqualConfig.default_yaml()` są przypięte z rewizji 2fe7e47.
    Ten plik nadal nie włącza enforcementu: nie jest natywnym `pyqual.yaml`
    uruchamianym w pętli jakości.
  gates:
    - id: policy-schema-and-semantics
      command:
        - python3
        - adapters/standardctl.py
        - validate
        - --policy
        - priority-evolution.dsl.yaml
        - --schema
        - schemas/priority-evolution.schema.json
      expectedExitCodes: [0]
    - id: ecosystem-registry-schema
      command:
        - python3
        - adapters/ecosystemctl.py
        - validate-registry
        - --registry
        - registry/ecosystem-tools.yaml
        - --schema
        - schemas/ecosystem-tool-registry.schema.json
      expectedExitCodes: [0]
    - id: unit-and-negative-behavior-tests
      command:
        - python3
        - -m
        - unittest
        - discover
        - -s
        - tests
        - -v
      expectedExitCodes: [0]
  promotionRequirement:
    - Keep enforcement disabled until 30 shadow receipts exist.
    - Prove one negative fixture changes a native pyqual gate outcome.
    - Independent validation of the exact patch hash.
